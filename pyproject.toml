[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voxadapt"
version = "0.1.0"
description = "A latency-aware, personalized voice post-editor that learns from corrections."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Frank Hou" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2", "pyarrow>=18,<22"]
ml = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<4",
  "peft>=0.14,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.2,<3",
  "transformers>=4.47,<5",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
voxadapt = "voxadapt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxadapt"]

[tool.pytest.ini_options]
addopts = "-q --cov=voxadapt --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
